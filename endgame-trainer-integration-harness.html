<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAISSA ET.7 Integration Harness</title>
<link rel="stylesheet" href="assets/css/chessboard-1.0.0.min.css"><link rel="stylesheet" href="css/endgame-trainer-integration-harness.css">
<script type="importmap">{"imports":{"chess.js":"https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm"}}</script></head><body><main class="eti-shell"><h1>ET.7 Session-to-Board Harness</h1>
<section class="eti-config"><label>Category<select id="category"><option>KQK</option><option>KRK</option><option>KPK</option><option>KPKP</option></select></label><label>User color<select id="color"><option>white</option><option>black</option><option>random</option></select></label><label>Seed<input id="seed" value="ET.7-browser"></label><label>Candidates<input id="candidates" type="number" min="1" max="100" value="12"></label><label>Minimum score<input id="score" type="number" min="0" max="100" placeholder="default"></label></section>
<section class="eti-actions"><button id="prepare">Prepare</button><button id="start">Start</button><button id="hint">Hint</button><button id="undo">Undo</button><button id="restart">Restart</button><button id="new-position">New Position</button><button id="resign">Resign</button><button id="flip">Flip</button><button id="dispose">Dispose</button><button id="reinitialize">Reinitialize</button></section>
<div id="workspace" class="eti-main" aria-busy="false"><section class="eti-panel"><div id="board" class="eti-board"></div></section><aside class="eti-panel"><h2>Session state</h2><pre id="status" class="eti-status"></pre><h3>History</h3><pre id="history" class="eti-history"></pre><h3>Log</h3><pre id="log" class="eti-log"></pre><p id="live" role="status" aria-live="polite"></p></aside></div>
<dialog id="promotion" class="eti-promotion" aria-labelledby="promotion-title"><h2 id="promotion-title">Choose promotion</h2><div class="eti-promotion-actions"><button data-piece="q">Queen</button><button data-piece="r">Rook</button><button data-piece="b">Bishop</button><button data-piece="n">Knight</button><button data-piece="">Cancel</button></div></dialog></main>
<script src="/assets/vendor/jquery/jquery-3.6.0.min.js"></script><script src="/assets/vendor/chessboard.js/chessboard-1.0.0.min.js"></script>
<script type="module">import { createEndgameTrainerRuntime } from './js/endgame-trainer/endgame-trainer-runtime.js';
const el=id=>document.getElementById(id), status=el('status'), history=el('history'), log=el('log'), live=el('live'), dialog=el('promotion'), workspace=el('workspace');let runtime=null,promotionResolve=null;const metrics={};
function promotionResolver(){return new Promise(resolve=>{promotionResolve=value=>{promotionResolve=null;dialog.close();resolve(value)};dialog.showModal();dialog.querySelector('button').focus()})}dialog.addEventListener('click',event=>{const value=event.target.dataset.piece;if(value!==undefined)promotionResolve?.(value||null)});dialog.addEventListener('cancel',event=>{event.preventDefault();promotionResolve?.(null)});
function cancelPromotion(){promotionResolve?.(null)}function render(snapshot){const state=snapshot.controllerState||runtime?.controller.getState(),loading=Boolean(snapshot.loading),session=Boolean(state?.sessionId),disposed=snapshot.disposed||state?.status==='disposed';workspace.setAttribute('aria-busy',String(loading||state?.engineThinking));el('prepare').disabled=loading||disposed;el('start').disabled=loading||state?.status!=='ready';el('hint').disabled=loading||state?.status!=='user-turn';el('undo').disabled=loading||state?.status!=='user-turn';el('restart').disabled=disposed||!session||state?.status==='preparing';el('new-position').disabled=disposed||!session||state?.status==='preparing';el('resign').disabled=disposed||!session||state?.status==='resigned';el('flip').disabled=disposed;el('dispose').disabled=disposed;status.textContent=JSON.stringify({...state,loading:snapshot.loading,hint:snapshot.hint,workerUrl:'engine/stockfish-working.js',metrics},null,2);history.textContent=JSON.stringify(state?.moveHistory||[],null,2)}function note(message){live.textContent=message;log.textContent+=`${message}\n`}
function create(){runtime=createEndgameTrainerRuntime({boardElement:el('board'),promotionResolver,callbacks:{onStateChange:render,onAnnouncement:note,onError:error=>note(`Error: ${error.code}`),onBoardError:error=>note(`Board: ${error.code}`)}});const started=performance.now();runtime.initialize();metrics.initializeMs=performance.now()-started;render(runtime.binding.getState());window.et7Runtime=runtime}
async function timed(name,operation){const start=performance.now();try{return await operation()}catch(error){note(error.code||error.message);return null}finally{metrics[`${name}Ms`]=performance.now()-start;render(runtime.binding.getState())}}
el('prepare').onclick=()=>timed('prepare',()=>runtime.binding.prepare({categoryId:el('category').value,userColor:el('color').value,seed:el('seed').value,candidateCount:Number(el('candidates').value),minimumScore:el('score').value?Number(el('score').value):undefined}));el('start').onclick=()=>timed('start',()=>runtime.binding.start());el('hint').onclick=()=>timed('hint',()=>runtime.binding.requestHint());el('undo').onclick=()=>timed('undo',()=>runtime.binding.undo());el('restart').onclick=()=>{cancelPromotion();return timed('restart',()=>runtime.binding.restart())};el('new-position').onclick=()=>{cancelPromotion();return timed('newPosition',()=>runtime.binding.newPosition({seed:`${el('seed').value}-${Date.now()}`}))};el('resign').onclick=()=>{cancelPromotion();return timed('resign',()=>runtime.binding.resign())};el('flip').onclick=()=>runtime.binding.flip();el('dispose').onclick=()=>{cancelPromotion();runtime.dispose();render(runtime.binding.getState())};el('reinitialize').onclick=()=>{cancelPromotion();runtime?.dispose();create()};create();</script></body></html>
