<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECO Chess Opening Codes</title>
  <meta name="description" content="Browse ECO chess opening codes A00-E99 with names and details.">
  <link rel="stylesheet" href="styles.css?v=2.0.1">
  <link rel="stylesheet" href="css/eco-page.css?v=1.0.0">
</head>
<body>
  <main class="eco-root">
    <header class="eco-header">
      <a class="eco-back" href="/">Back to CAISSA</a>
      <h1>ECO Chess Opening Codes</h1>
    </header>

    <section id="ecoListView">
      <div class="eco-toolbar">
        <input id="ecoSearch" type="search" placeholder="Search by code (B20) or opening name (Sicilian)" aria-label="Search ECO codes">
        <div class="eco-tabs" id="ecoTabs" aria-label="ECO groups"></div>
      </div>
      <div id="ecoList" class="eco-list"></div>
      <p id="ecoFallback" class="eco-fallback" style="display:none;">ECO dataset failed to load.</p>
    </section>

    <section id="ecoDetailView" style="display:none;">
      <p><a id="ecoBackLink" class="eco-back-inline" href="/eco">? Back to ECO list</a></p>
      <h2 id="ecoDetailTitle"></h2>
      <p id="ecoDetailMoves"></p>
      <h3>Related Lines</h3>
      <ul id="ecoDetailRelated" class="eco-related"></ul>
      <h3>Coach Theory</h3>
      <div id="ecoDetailTheory" class="eco-theory"></div>
    </section>
  </main>
  <script src="js/eco-page.js?v=1.0.0" defer></script>
</body>
</html>
