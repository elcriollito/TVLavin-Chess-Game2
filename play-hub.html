<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Play | CAISSA Mobile</title>
  <link rel="icon" href="/favicon.ico?v=4">
  <link rel="stylesheet" href="/css/mobile2-destination-header.css?v=1.2.0">
  <link rel="stylesheet" href="/css/play-hub.css?v=1.0.0">
  <script src="/js/mobile2-destination-header.js?v=1.2.0"></script>
</head>
<body class="play-hub-page">
  <header class="play-hub-header" data-caissa-mobile2-header-host></header>
  <main class="play-hub-main" id="main">
    <div class="play-hub-intro">
      <h1>Choose how you want to play</h1>
    </div>
    <nav class="play-hub-grid" aria-label="Play destinations">
      <a class="play-hub-card" data-play-hub-destination="play" href="/play/games">
        <span class="play-hub-card__icon" aria-hidden="true">&#9654;</span>
        <span class="play-hub-card__copy"><strong>Play</strong><small>Start a game in CAISSA Play.</small></span>
        <span class="play-hub-card__chevron" aria-hidden="true">&#8250;</span>
      </a>
      <a class="play-hub-card" data-play-hub-destination="online" href="/online">
        <span class="play-hub-card__icon" aria-hidden="true">&#9678;</span>
        <span class="play-hub-card__copy"><strong>CAISSA Online</strong><small>Find and play another CAISSA player.</small></span>
        <span class="play-hub-card__chevron" aria-hidden="true">&#8250;</span>
      </a>
      <a class="play-hub-card" data-play-hub-destination="playchess" href="/play-online/playchess">
        <span class="play-hub-card__icon play-hub-card__icon--knight" aria-hidden="true">&#9822;</span>
        <span class="play-hub-card__copy"><strong>Playchess</strong><small>Play as a guest on the Playchess network.</small></span>
        <span class="play-hub-card__chevron" aria-hidden="true">&#8250;</span>
      </a>
      <a class="play-hub-card" data-play-hub-destination="fics" href="/fics">
        <span class="play-hub-card__icon" aria-hidden="true">&#9673;</span>
        <span class="play-hub-card__copy"><strong>FICS</strong><small>Enter the Free Internet Chess Server.</small></span>
        <span class="play-hub-card__chevron" aria-hidden="true">&#8250;</span>
      </a>
    </nav>
  </main>
</body>
</html>
