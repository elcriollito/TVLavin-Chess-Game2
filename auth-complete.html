<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0f1a">
  <title>Finishing account setup – CAISSA Chess</title>
  <link rel="stylesheet" href="/css/caissa-auth.css?v=1.1.0">
</head>
<body class="auth-page-body">
  <main class="auth-page-container">
    <section class="auth-page-card auth-setup-card" aria-labelledby="account-setup-title" aria-live="polite">
      <div class="auth-setup-spinner" aria-hidden="true"></div>
      <h1 id="account-setup-title" class="auth-page-title">Finishing your account setup…</h1>
      <p id="account-setup-status" class="auth-page-subtitle">This should only take a moment.</p>
      <button id="account-setup-retry" class="auth-setup-retry" type="button" hidden>Try again</button>
    </section>
  </main>
  <script src="/js/auth-config.js?v=1.0.5"></script>
  <script src="/js/caissa-auth.js?v=1.0.4" defer></script>
  <script src="/js/auth-complete.js?v=1.0.0" defer></script>
</body>
</html>
