<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Save and organize chess positions, games, and analysis in your CAISSA Game Library.">
  <title>Game Library — Under Construction | CAISSA Chess</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0b111b">
  <link rel="icon" href="/favicon.ico?v=4">
  <link rel="stylesheet" href="/assets/vendor/font-awesome/css/all-6.4.0.min.css">
  <link rel="stylesheet" href="/styles.css?v=2.0.16">
  <link rel="stylesheet" href="/css/caissa-standalone-sidebar.css?v=1.1.0">
  <link rel="stylesheet" href="/css/game-library-page.css?v=1.0.0">
  <script src="/js/caissa-vercel-analytics.js?v=1.0.0" defer></script>
</head>
<body class="game-library-page" data-game-library-release="under-construction">
  <a class="game-library-skip-link" href="#game-library-main" data-caissa-i18n="library.skip">Skip to Game Library</a>
  <div class="caissa-standalone-layout">
    <div data-caissa-standalone-sidebar data-active="library"></div>
    <main id="game-library-main" class="caissa-standalone-content game-library-main" tabindex="-1">
      <section class="game-library-construction" data-caissa-library-public-presentation
        aria-labelledby="game-library-title" data-caissa-i18n-aria-label="library.presentationLabel">
        <div class="game-library-construction-visual" aria-hidden="true">
          <i class="fas fa-book-open"></i>
          <i class="fas fa-chess-knight"></i>
        </div>
        <p class="game-library-status" data-caissa-i18n="library.status">Under Construction</p>
        <h1 id="game-library-title" data-caissa-i18n="library.title">Game Library</h1>
        <p data-caissa-i18n="library.copyPrimary">We’re building your personal chess library.</p>
        <p data-caissa-i18n="library.copySecondary">Soon you’ll be able to save positions, games and analysis here.</p>
        <a class="game-library-back" href="/play">
          <i class="fas fa-arrow-left" aria-hidden="true"></i>
          <span data-caissa-i18n="library.backToPlay">Back to Play</span>
        </a>
      </section>
    </main>
  </div>
  <script src="/js/caissa-i18n.js?v=1.1.0"></script>
  <script src="/js/caissa-primary-navigation.js?v=1.0.2"></script>
  <script src="/js/caissa-standalone-sidebar.js?v=1.1.0"></script>
  <script src="/js/game-library-page.js?v=1.0.0"></script>
</body>
</html>
