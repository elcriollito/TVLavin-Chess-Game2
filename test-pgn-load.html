            div.style.border = success ? '2px solid green' : '2px solid red';

                <p><strong>Result:</strong> ${success ? '✅ SUCCESS' : '❌ FAILED'}</p>
                <p><strong>PGN Length:</strong> ${pgn.length} chars</p>
                <pre style="max-height: 200px; overflow: auto; background: #f0f0f0; padding: 10px;">${pgn}</pre>
            `;

            results.appendChild(div);
        }

        // Test 1: Evergreen Game (SHOULD WORK)
        const evergreenPGN = `[Event "Berlin"]

[Date "1852.??.??"]

[White "Capablanca"]

        testPGN('First 10 Moves', capablancaFirst10);

        // Test 8: Try moves 1-11 to see if move 11 is the problem
        const capablancaFirst11 = `[Event "Test"]
[White "Capablanca"]
[Black "Corzo"]
[Result "*"]

1. e4 e5 2. Nf3 Nc6 3. Bb5 Nf6 4. Qe2 Be7 5. d4 exd4 6. e5 Ne4 7. O-O Nc5 8. Nxd4 O-O 9. Nxc6 dxc6 10. Bc4 Qd4 *`;

        testPGN('First 11 Moves (includes Qd4)', capablancaFirst11);

        // Test 9: Manually verify the position after move 10 by playing move by move
        const chess = new Chess();
        const moves = [
            'e4', 'e5', 'Nf3', 'Nc6', 'Bb5', 'Nf6', 'Qe2', 'Be7',
            'd4', 'exd4', 'e5', 'Ne4', 'O-O', 'Nc5', 'Nxd4', 'O-O',
            'Nxc6', 'dxc6', 'Bc4'
        ];

        let manualTest = true;
        let failedAtMove = -1;
        for (let i = 0; i < moves.length; i++) {
            const result = chess.move(moves[i]);
            if (!result) {
                manualTest = false;
                failedAtMove = i;
                break;
            }
        }

        // Now try Qd4
        const qd4Result = chess.move('Qd4');

        const div = document.createElement('div');
        div.style.marginBottom = '20px';
        div.style.padding = '10px';
        div.style.border = qd4Result ? '2px solid green' : '2px solid red';

        div.innerHTML = `
            <h3>Manual Move-by-Move Test</h3>
            <p><strong>Moves 1-10:</strong> ${manualTest ? '✅ SUCCESS' : `❌ FAILED at move ${failedAtMove + 1}`}</p>
            <p><strong>Move 11 (Qd4):</strong> ${qd4Result ? '✅ SUCCESS' : '❌ FAILED (Illegal move!)'}</p>
            <p><strong>FEN after move 10:</strong> ${chess.fen()}</p>
            <p><strong>Legal moves for Black:</strong> ${chess.moves().join(', ')}</p>
        `;

        results.appendChild(div);

        // Test 10: Try with valid date format (no ??)
