name: Verify large PGN collections

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-large-pgn-collections.yml'
      - 'js/pgn-replayer/pgn-core.js'
      - 'js/pgn-replayer/pgn-worker.js'
      - 'pgn-replayer.html'
      - 'scripts/verify-large-pgn-collections.mjs'
      - 'tests/pgn-replayer/large-collection-runtime-contract.test.js'
      - 'public/data/pgn/players/manifest.json'
      - 'public/data/pgn/players/*.pgn'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-large-pgn-collections
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check verifier
        run: node --check scripts/verify-large-pgn-collections.mjs

      - name: Verify local archive and runtime capacity contract
        run: node --test tests/pgn-replayer/large-collection-runtime-contract.test.js

      - name: Verify every archived album above 2,000 games
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/qa
          {
            echo "CAISSA large PGN collection verification"
            echo "source_commit=$GITHUB_SHA"
            echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            node scripts/verify-large-pgn-collections.mjs
          } | tee docs/qa/LARGE_PGN_COLLECTION_VERIFICATION.txt

      - name: Persist verification evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/qa/LARGE_PGN_COLLECTION_VERIFICATION.txt
          if git diff --cached --quiet; then
            echo 'Verification evidence is unchanged.'
            exit 0
          fi
          git commit -m 'test(pgn): certify large archived collections'
          git pull --rebase origin main
          git push origin HEAD:main
